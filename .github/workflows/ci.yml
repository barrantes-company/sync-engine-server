name: CI Engine Sync Server

on:
  push:
    branches: [ feat/android-home-widget-sync-design, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run V1 Hub-and-Spoke Tests
        run: npm run test:ci
