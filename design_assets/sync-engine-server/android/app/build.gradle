plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barrantesco.syncengine'
    compileSdk 35

    defaultConfig {
        applicationId 'com.barrantesco.syncengine'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        // URL de /widget.html de fábrica; se toma del entorno para no fijar un dominio en el repo.
        def defaultUrl = (System.getenv('SYNC_DEFAULT_URL') ?: '').replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField 'String', 'DEFAULT_WIDGET_URL', "\"${defaultUrl}\""
        def firebaseApiKey = (System.getenv('FIREBASE_ANDROID_API_KEY') ?: '').replace('\\', '\\\\').replace('"', '\\"')
        def firebaseProjectId = (System.getenv('FIREBASE_PROJECT_ID') ?: '').replace('\\', '\\\\').replace('"', '\\"')
        def firebaseAppId = (System.getenv('FIREBASE_ANDROID_APP_ID') ?: '').replace('\\', '\\\\').replace('"', '\\"')
        def firebaseSenderId = (System.getenv('FIREBASE_SENDER_ID') ?: '').replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField 'String', 'FIREBASE_API_KEY', "\"${firebaseApiKey}\""
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', "\"${firebaseProjectId}\""
        buildConfigField 'String', 'FIREBASE_APP_ID', "\"${firebaseAppId}\""
        buildConfigField 'String', 'FIREBASE_SENDER_ID', "\"${firebaseSenderId}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Credenciales de release leídas del entorno; nunca se guardan en el repo.
    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }

    }

    buildTypes {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-messaging'
}
